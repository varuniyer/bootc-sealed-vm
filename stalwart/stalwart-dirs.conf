d /var/lib/stalwart 0700 stalwart stalwart -
# Z keeps the store's labels and owner current when an image update changes the SELinux policy or stalwart's uid.
Z /var/lib/stalwart - stalwart stalwart -
# The setgid bit gives every file boot-config.sh writes here the stalwart group.
d /run/stalwart 2750 root stalwart -
