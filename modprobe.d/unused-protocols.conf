# The kernel loads a protocol's module when any process opens a socket of its family or configures
# it over netlink. The VM uses none of these: IPsec, Ceph, Open vSwitch, Qualcomm IPC routing, NFS's
# RPC, and VM sockets.
install esp4 /bin/false
install esp6 /bin/false
install esp4_offload /bin/false
install esp6_offload /bin/false
install xfrm_interface /bin/false
install xfrm_ipcomp /bin/false
install ceph /bin/false
install libceph /bin/false
install openvswitch /bin/false
install qrtr /bin/false
install sunrpc /bin/false
install vsock /bin/false
