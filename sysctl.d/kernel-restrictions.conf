# No unit creates a user namespace: service-restrictions.conf sets RestrictNamespaces, and
# DynamicUser needs none.
user.max_user_namespaces = 0
# Updates boot through the firmware and the signed UKI, never through kexec.
kernel.kexec_load_disabled = 1
# Nothing logs in to attach a debugger, so only CAP_SYS_PTRACE may trace.
kernel.yama.ptrace_scope = 2
net.core.bpf_jit_harden = 2
# The serial console's line discipline is built in, and no process needs another.
dev.tty.ldisc_autoload = 0
# No service here uses io_uring, so no process may create a ring.
kernel.io_uring_disabled = 2
