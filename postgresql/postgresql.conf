# initdb's pg_hba.conf in the data directory trusts every local connection, so bootstrap.sh's
# server and postgresql.service both read the shipped one.
hba_file = '/etc/postgresql/pg_hba.conf'

# service-restrictions.conf's RestrictAddressFamilies= admits IPv4 sockets, so the server listens on
# the IPv4 loopback address.
listen_addresses = '127.0.0.1'
port = 5432
# Clients connect through /run/postgresql, where PGDG's libpq looks by default and every unit sees
# the same directory.
unix_socket_directories = '/run/postgresql'

# Sized for m9g.medium (1 Arm vCPU, 4GB RAM) on a gp3 volume.
max_connections = 200
max_parallel_workers_per_gather = 0
shared_buffers = 1GB
work_mem = 4MB
random_page_cost = 1.1
effective_cache_size = 2GB
max_wal_size = 4GB
checkpoint_timeout = 30min
maintenance_work_mem = 256MB
autovacuum_max_workers = 1
autovacuum_work_mem = 64MB